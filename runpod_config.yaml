# RunPod serverless handler configuration
# Enterprise Configuration - Single Source of Truth
# All parameters defined here are automatically merged into nested configs at runtime

# MoDA model configuration
runpod:
  model_name: "MoDA"
  version: "1.0.0"

# Paths
inference_config_path: "configs/audio2motion/inference/inference.yaml"
motion_mean_std_path: "src/datasets/mean.pt"

# Model paths (used by ensure_models_downloaded)
paths:
  pretrain_weights: "/workspace/pretrain_weights"
  models_cache: "/app/models_cache"

# ============================================================================
# INFERENCE CONFIGURATION
# These parameters are merged into inference.yaml at runtime
# Optimized for A6000/A40 48GB GPU ($0.00034/sec = $1.22/hr)
# ============================================================================
inference:
  batch_size: 10  # Original working value - keep at 10 for accurate lip sync
                  # DO NOT increase - larger values (50+) can break audio-video synchronization
                  # Increased batch_size causes timing issues with motion generation
  device_id: 0  # Can be overridden via CUDA_DEVICE_ID or MODA_INFERENCE_DEVICE_ID
  source_max_dim: 512  # Keep at 512 for accurate lip sync
                        # DO NOT increase - larger values break audio-video synchronization
                        # Increased resolution (640+) causes timing issues with audio processing
  source_division: 2  # make sure the height and width of source image or video can be divided by this number
  input_height: 256
  input_width: 256
  output_fps: 25
  source_fps: 25
  min_video_length: 50
  max_video_length: 1000  # 40 seconds at 25fps (A6000/A40 48GB limit)
                           # Increased from 500 (20 sec) → can handle longer videos

# ============================================================================
# MOTION PROCESSOR CONFIGURATION
# These parameters are merged into liveportrait_config.yaml at runtime
# Optimized for A6000/A40 48GB GPU
# ============================================================================
motion_processor:
  batch_size: 10  # Original working value - keep at 10 for accurate lip sync
                  # DO NOT increase - larger values (50+) can break audio-video synchronization
                  # Increased batch_size causes timing issues with motion generation
  warp_decode_batch_size: 20  # Increased from 75 → faster warp_decode on A6000/A40 48GB
                               # A6000/A40 can handle larger batches for warp_decode processing
  source_max_dim: 512  # Original working value - keep at 512 for accurate lip sync
                        # DO NOT increase - larger values break audio-video synchronization
  source_division: 2  # make sure the height and width of source image or video can be divided by this number
  input_height: 256
  input_width: 256
  output_height: 512  # Original working value - keep at 512 for accurate lip sync
                       # DO NOT increase - larger values break audio-video synchronization
  output_width: 512   # Original working value - keep at 512 for accurate lip sync
  output_fps: 25
  # Expression and motion control - for more expressive facial movements
  flag_relative_motion: False  # Original working value - keep at False for accurate lip sync
                                # True can cause timing issues with audio-driven motion
                                # Relative motion calculation may interfere with lip synchronization
  driving_option: "expression-friendly"  # "expression-friendly" or "pose-friendly"
                                         # expression-friendly: emphasizes facial expressions (eyes, eyebrows, lips)
                                         # pose-friendly: emphasizes head pose movements
  driving_multiplier: 1.0  # Motion intensity multiplier (1.0 = neutral, 1.2 = 20% more expressive, 1.5 = 50% more)
                           # Reduced from 1.5 to 1.2 to preserve lip sync accuracy
                           # Higher values (1.5+) can break lip synchronization with audio
                           # 1.2 provides good balance: expressive movements without breaking lip sync
  # Emotion configuration
  default_emotion: 8  # Default emotion code if not specified in request (0-8)
                      # 0: Anger, 1: Contempt, 2: Disgust, 3: Fear, 4: Happiness,
                      # 5: Neutral, 6: Sadness, 7: Surprise, 8: None (no emotion)
                      # Default: 8 (None) - no emotion applied, uses audio-driven expressions only
                      # Can be overridden per request via emotion parameter
                      # Changed from 7 (Surprise) to 8 (None) to preserve lip sync accuracy
  emo_scale: 1.0  # Emotion strength multiplier (1.0 = default, >1.0 = stronger emotions)
                  # Reduced from 1.5 to 1.0 to preserve lip sync accuracy
                  # Higher values (1.5-2.0) can interfere with audio-driven lip movements
                  # Values >1.3 may cause artifacts and break lip synchronization

# ============================================================================
# VIDEO QUALITY SETTINGS
# These parameters control video encoding quality (Telegram optimized)
# ============================================================================
video_quality:
  crf: 18              # High quality encoding (excellent quality, close to lossless)
                       # CRF 18 = excellent quality, close to lossless
                       # Lower CRF = better quality (18=best, 23=medium, 28=low)
                       # DICE-Talk uses CRF 17-18, MoDA now matches this quality
                       # Improved from 25 to 18 for better video quality without affecting lip sync
  codec: "libx264"     # H.264 video codec
  preset: "medium"     # Encoding speed preset (faster/medium/slow)
                       # "medium" = better quality than "faster", matches DICE-Talk default
                       # Slower encoding but better compression efficiency
                       # Improved from "faster" to "medium" for better quality without affecting lip sync
                       # Options: ultrafast < superfast < veryfast < faster < fast < medium < slow < slower < veryslow
  pixelformat: "yuv420p"  # Pixel format for compatibility
  output_format: "mp4" # Output format

# ============================================================================
# PERFORMANCE OPTIMIZATION SETTINGS
# These parameters control performance optimizations for A6000/A40 48GB
# ============================================================================
performance:
  enable_torch_compile: False  # Disabled to preserve lip sync accuracy
                                # torch.compile can cause numerical precision issues affecting synchronization
                                # Maps to flag_do_torch_compile in liveportrait_config.yaml
  use_half_precision: False    # Disabled to preserve lip sync accuracy
                                # FP16 can cause numerical precision issues affecting synchronization
                                # Maps to flag_use_half_precision in liveportrait_config.yaml
  max_video_length: 1000      # 40 seconds max for A6000/A40 48GB
                              # Can be overridden by inference.max_video_length if set

# ============================================================================
# MEMORY OPTIMIZATION SETTINGS
# These parameters control GPU memory management
# ============================================================================
memory_optimization:
  pytorch_cuda_alloc_conf: "expandable_segments:True"  # Reduces CUDA memory fragmentation
                                                        # Critical for A6000/A40 48GB with large models

# ============================================================================
# GPU COMPATIBILITY SETTINGS
# These parameters control automatic GPU compatibility handling
# ============================================================================
compatibility:
  auto_disable_torch_compile_on_old_gpu: True  # Auto-disable if compute capability < 7.0
  auto_disable_fp16_on_old_gpu: True          # Auto-disable if compute capability < 7.0
  auto_adjust_batch_size_on_oom: True         # Auto-reduce batch_size on CUDA OOM
  max_oom_retries: 3                          # Max retries with reduced batch_size
  max_batch_size_by_memory:                   # Recommended max batch_size by GPU memory (GB)
    24: 25    # RTX 4090, RTX 3090
    40: 50    # A6000, A40
    48: 75    # A6000 48GB, A40 48GB
    80: 100   # A100

# ============================================================================
# RESOURCE LIMITS
# These parameters control resource usage and validation
# ============================================================================
resource_limits:
  max_image_size_mb: 10
  max_audio_size_mb: 50
  min_disk_space_gb: 10
  audio_pad_duration: 2.0

